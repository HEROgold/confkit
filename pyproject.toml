[project]
name = "confkit"
version = "3.0.0"
description = "Lightweight and Easy to use configuration manager for Python projects"
readme = "README.md"
authors = [
    { name = "HEROgold" }
]
requires-python = ">=3.11"
dependencies = [
    "typing-extensions>=4.16.0",
]

[project.optional-dependencies]
pydantic = [
    "pydantic>=2.14.2",
]
msgspec = [
    "msgspec>=0.22.0",
    "pyyaml>=6.0.3", # required by msgspec
    "tomli-w>=1.2.0", # required by msgspec
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "coverage>=7.17.0",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.170.14",
    "pydantic>=2.14.2",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "coveralls>=4.1.0",
    "msgspec>=0.22.0",
    "pyyaml>=6.0.3",
    "tomli-w>=1.2.0",
    "pytest-order>=1.5.0",
    "zensical>=0.0.73",
    "pdoc>=16.0.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.8.0",
    "mkdocstrings[python]>=1.0.8",
    "mkdocs-pdoc-plugin @ git+https://github.com/spirali/mkdocs-pdoc-plugin",
    "pdoc>=16.0.0",
    "zensical>=0.0.73",
]
lint = [
    "mypy>=2.4.1",
    "pyrefly>=1.4.0",
    "pyright>=1.1.414",
    "ruff>=0.17.3",
    "ty>=0.0.95",
    "undersort>=0.1.6",
    "zuban>=0.10.2",
]

[[tool.pyright.executionEnvironments]]
root = "."
include = ["**/test_*.py", "**/tests/**/*.py"]
reportPrivateUsage = "none"

[tool.ty.src]
include = ["src"]
exclude = ["tests"]

[tool.ty.rules]
invalid-assignment = "ignore"

[tool.undersort]
order = ["public", "protected", "private"]
method_type_order = ["instance", "class", "static"]
