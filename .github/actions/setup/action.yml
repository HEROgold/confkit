name: Set up uv and the project
description: Install uv and a Python version, then sync the locked dependency groups.

inputs:
  python-version:
    description: Python version to install.
    default: "3.13"
  sync-args:
    description: Extra arguments for `uv sync`, such as `--group dev`.
    default: ""

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python ${{ inputs.python-version }}
      shell: bash
      run: uv python install ${{ inputs.python-version }}

    - name: Install dependencies
      shell: bash
      run: uv sync --locked --python ${{ inputs.python-version }} ${{ inputs.sync-args }}
