name: CI

# One entry point for every check. The changes job compares the push or PR
# against .github/ci-filters.yml, and each check only runs when its inputs
# changed. Release and Coverage hang off this workflow's runs on master.
#
# None of these checks is required by the master ruleset. If one becomes
# required, a skipped job reports as skipped, which GitHub counts as passing
# for jobs but not for a required workflow-level check. Require the job names
# below (for example "test / test (3.13)"), not a whole workflow.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    # closed only removes the docs preview.
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # A manual run checks everything.
      test: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.test == 'true' }}
      lint: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.lint == 'true' }}
      lint-public: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.lint-public == 'true' }}
      coverage: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.coverage == 'true' }}
      docs: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.docs == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: .github/ci-filters.yml

  test:
    needs: changes
    if: needs.changes.outputs.test == 'true'
    uses: ./.github/workflows/test.yml

  lint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    uses: ./.github/workflows/lint.yml
    with:
      name: lint
      tools: >-
        [
          {"tool": "ruff", "args": "check ."},
          {"tool": "ty", "args": "check . --ignore no-matching-overload"},
          {"tool": "undersort", "args": ". --check"}
        ]

  lint-public:
    needs: changes
    if: needs.changes.outputs.lint-public == 'true'
    uses: ./.github/workflows/lint.yml
    with:
      name: lint-public
      tools: >-
        [
          {"tool": "ruff", "args": "check ./examples"},
          {"tool": "ty", "args": "check ./examples --ignore no-matching-overload"},
          {"tool": "pyrefly", "args": "check ./examples"},
          {"tool": "zuban", "args": "check ./examples"},
          {"tool": "mypy", "args": "./examples"},
          {"tool": "pyright", "args": "./examples"}
        ]

  gitleaks:
    if: github.event.action != 'closed'
    uses: ./.github/workflows/gitleaks.yml

  docs:
    needs: changes
    # Always runs on closed, so the preview gets removed even when no docs input changed.
    if: always() && (github.event.action == 'closed' || needs.changes.outputs.docs == 'true')
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: write
      pull-requests: write

  coverage:
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.coverage == 'true'
    uses: ./.github/workflows/coverage.yml
    secrets:
      COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}

  coverage-b:
    needs: [changes, test]
    if: always() && github.event_name == 'push' && needs.test.result == 'success'
    uses: ./.github/workflows/coverage-b.yml
    with:
      tests-ran: ${{ needs.test.outputs.ran }}
    secrets:
      COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
