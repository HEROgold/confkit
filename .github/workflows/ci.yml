name: CI

# One entry point for every check. The changes job compares the push or PR
# against .github/ci-filters.yml, and each check only runs when its inputs
# changed. Version labels bump the PR's own branch through bump.yml. On a
# push to master that passes all-checks, the release job releases any version
# that has no tag yet, then dispatches new-release-created, which starts
# pypi.yml. Coverage stays outside the chain.
#
# The master ruleset requires none of these checks. To require them, require
# the all-checks job only. A called workflow's check names change with whether
# it ran ("test / test (3.13)") or was skipped ("test"), so neither name works
# as a required check on its own.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    # closed only removes the docs preview.
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

# A newer push to a PR cancels its older run. Pushes to master each get their
# own group, because GitHub keeps only one pending run per group and would
# drop a merge's run, along with its release.
concurrency:
  group: ${{ github.event_name == 'push' && github.run_id || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  changes:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # A manual run checks everything.
      test: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.test == 'true' }}
      lint: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.lint == 'true' }}
      public-api: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.public-api == 'true' }}
      coverage: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.coverage == 'true' }}
      docs: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.docs == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: .github/ci-filters.yml

  test:
    needs: changes
    if: needs.changes.outputs.test == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    uses: HEROgold/workflows/.github/workflows/test.yml@7fa83832879872517776e70f2b5c18f180e21421 # v1.0.0
    permissions:
      contents: read
    with:
      python-version: ${{ matrix.python-version }}
      sync-args: --group dev
      pytest-args: . --ignore=tests/test_examples_run.py
      import-check: confkit

  lint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    uses: HEROgold/workflows/.github/workflows/lint.yml@7fa83832879872517776e70f2b5c18f180e21421 # v1.0.0
    permissions:
      contents: read
    with:
      cache-prefix: lint
      sync-args: --group dev --group lint
      tools: >-
        [
          {"tool": "ruff", "args": "check ."},
          {"tool": "ty", "args": "check . --ignore no-matching-overload"},
          {"tool": "undersort", "args": ". --check"}
        ]

  public-api:
    needs: changes
    if: needs.changes.outputs.public-api == 'true'
    uses: HEROgold/workflows/.github/workflows/public-api.yml@7fa83832879872517776e70f2b5c18f180e21421 # v1.0.0
    permissions:
      contents: read
    with:
      paths: examples
      blocking: true
      sync-args: --group dev --group lint

  gitleaks:
    if: github.event.action != 'closed'
    uses: HEROgold/workflows/.github/workflows/gitleaks.yml@7fa83832879872517776e70f2b5c18f180e21421 # v1.0.0
    permissions:
      contents: read

  workflow-lint:
    if: github.event.action != 'closed'
    uses: HEROgold/workflows/.github/workflows/workflow-lint.yml@7fa83832879872517776e70f2b5c18f180e21421 # v1.0.0
    permissions:
      contents: read

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: HEROgold/workflows/.github/workflows/docs.yml@7fa83832879872517776e70f2b5c18f180e21421 # v1.0.0
    permissions:
      contents: read

  # Not a check, so all-checks doesn't wait on it. Each PR and master get their
  # own group. A newer run waiting in the group replaces an older waiting one,
  # so the newest docs always win.
  docs-publish:
    needs: docs
    # Always runs on closed, so the preview gets removed even when no docs input changed.
    if: always() && (github.event.action == 'closed' || needs.docs.result == 'success')
    concurrency:
      group: gh-pages-${{ github.event.pull_request.number || 'master' }}
    uses: HEROgold/workflows/.github/workflows/docs-publish.yml@7fa83832879872517776e70f2b5c18f180e21421 # v1.0.0
    permissions:
      contents: write
      pull-requests: write
    with:
      default-branch: master

  coverage:
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.coverage == 'true'
    uses: HEROgold/workflows/.github/workflows/coverage.yml@7fa83832879872517776e70f2b5c18f180e21421 # v1.0.0
    permissions:
      contents: read
    with:
      sync-args: --group dev
      pytest-args: tests/
    secrets:
      COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}

  # Passes when every check passed or was skipped because its inputs didn't
  # change. Coverage is informational, so it isn't listed.
  all-checks:
    if: always() && github.event.action != 'closed'
    needs: [changes, test, lint, public-api, gitleaks, workflow-lint, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail if a check failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  # always() is needed even though all-checks passed. Without it, GitHub's
  # implicit success() also looks at the checks all-checks needs, and skips
  # this job whenever one of them was skipped.
  release:
    needs: all-checks
    if: always() && github.event_name == 'push' && needs.all-checks.result == 'success'
    uses: HEROgold/workflows/.github/workflows/release.yml@7fa83832879872517776e70f2b5c18f180e21421 # v1.0.0
    permissions:
      contents: write
    with:
      version-command: uv version --short
      version-file: pyproject.toml
      sentry: true
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
