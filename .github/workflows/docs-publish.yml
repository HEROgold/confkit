name: Publish documentation

# Called from ci.yml after the docs build. Pages serves the gh-pages branch.
# Master publishes to its root, and each PR from this repo gets a preview under
# pr-previews/pr-<n>/. Fork PRs get no preview, because their token can't push
# to gh-pages. Both actions fetch and rebase when another run pushed first.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  preview:
    if: >-
      github.event_name == 'pull_request'
      && github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Deploy the PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: site
          preview-branch: gh-pages
          umbrella-dir: pr-previews
          action: deploy

  remove-preview:
    if: >-
      github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Remove the PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          preview-branch: gh-pages
          umbrella-dir: pr-previews
          action: remove

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      # Only the root needs .nojekyll. In a preview it would outlive the
      # preview's removal, which skips hidden files.
      - name: Keep Pages from running Jekyll
        run: touch site/.nojekyll

      - name: Publish to the gh-pages root
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          branch: gh-pages
          clean-exclude: pr-previews
