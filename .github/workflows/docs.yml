name: Documentation

# Called from ci.yml. Pages serves the gh-pages branch: master publishes to its
# root, and each PR from this repo gets a preview under pr-previews/pr-<n>/.
# Fork PRs only build, because their token can't push to gh-pages.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up the project
        uses: ./.github/actions/setup
        with:
          sync-args: --group docs

      - name: Build the site
        run: |
          uv run pdoc confkit -o docs/api
          uv run zensical build --clean
          touch site/.nojekyll

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          include-hidden-files: true

  preview:
    needs: build
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency: gh-pages
    permissions:
      contents: write       # push the preview to gh-pages
      pull-requests: write  # comment the preview link on the PR
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Deploy the PR preview
        if: ${{ !env.ACT }}
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: site
          preview-branch: gh-pages
          umbrella-dir: pr-previews
          action: deploy

  remove-preview:
    if: >-
      github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency: gh-pages
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Remove the PR preview
        if: ${{ !env.ACT }}
        uses: rossjrw/pr-preview-action@v1
        with:
          preview-branch: gh-pages
          umbrella-dir: pr-previews
          action: remove

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency: gh-pages
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Publish to the gh-pages root
        if: ${{ !env.ACT }}
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          branch: gh-pages
          clean-exclude: pr-previews
