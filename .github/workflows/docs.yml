name: Documentation

# Called from ci.yml. Pages serves the gh-pages branch. Master publishes to its
# root, and each PR from this repo gets a preview under pr-previews/pr-<n>/.
# Fork PRs only build, because their token can't push to gh-pages.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A hit means the site for these exact inputs is already built.
      - name: Cache the built site
        id: cache-site
        uses: actions/cache@v4
        with:
          path: site
          key: ${{ runner.os }}-site-${{ hashFiles('src/**', 'docs/**', 'zensical.toml', 'mkdocs.yml', 'pyproject.toml', 'uv.lock', '.github/workflows/docs.yml', '.github/actions/setup/**') }}

      - name: Set up the project
        if: steps.cache-site.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup
        with:
          sync-args: --group docs

      - name: Build the site
        if: steps.cache-site.outputs.cache-hit != 'true'
        run: |
          uv run pdoc confkit -o docs/api
          uv run zensical build --clean
          touch site/.nojekyll

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          include-hidden-files: true

  preview:
    needs: build
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency: gh-pages
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Deploy the PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: site
          preview-branch: gh-pages
          umbrella-dir: pr-previews
          action: deploy

  remove-preview:
    if: >-
      github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency: gh-pages
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Remove the PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          preview-branch: gh-pages
          umbrella-dir: pr-previews
          action: remove

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency: gh-pages
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Publish to the gh-pages root
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          branch: gh-pages
          clean-exclude: pr-previews
