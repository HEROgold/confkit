name: Documentation

# Called from ci.yml. Builds the site and uploads it as the "site" artifact.
# docs-publish.yml publishes it, so a cancelled publish never fails this check.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A hit means the site for these exact inputs is already built.
      - name: Cache the built site
        id: cache-site
        uses: actions/cache@v4
        with:
          path: site
          key: ${{ runner.os }}-site-${{ hashFiles('src/**', 'docs/**', 'zensical.toml', 'mkdocs.yml', 'pyproject.toml', 'uv.lock', '.github/workflows/docs.yml', '.github/actions/setup/**') }}

      - name: Set up the project
        if: steps.cache-site.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup
        with:
          sync-args: --group docs

      - name: Build the site
        if: steps.cache-site.outputs.cache-hit != 'true'
        run: |
          uv run pdoc confkit -o docs/api
          uv run zensical build --clean
          touch site/.nojekyll

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          include-hidden-files: true

