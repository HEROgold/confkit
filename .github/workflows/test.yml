name: Test

# Called from ci.yml, which decides whether the inputs below changed.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      # A hit means these exact inputs already passed on this Python version.
      # The cache only saves when the job succeeds, so a failure never hits.
      - name: Cache pytest results
        id: cache-pytest
        uses: actions/cache@v4
        with:
          path: .pytest_cache
          key: ${{ runner.os }}-pytest-${{ matrix.python-version }}-${{ hashFiles('src/**', 'tests/**', 'pyproject.toml', 'uv.lock', '.github/workflows/test.yml', '.github/actions/setup/**') }}

      - name: Set up the project
        if: steps.cache-pytest.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
          sync-args: --group dev

      - name: Run tests
        if: steps.cache-pytest.outputs.cache-hit != 'true'
        # Avoid executing examples in CI; they could run untrusted code from PRs
        run: uv run pytest . --ignore=tests/test_examples_run.py

  # The test job runs with dev dependencies installed, which can hide a
  # runtime import that isn't declared. Import the built wheel on its own.
  clean-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build the wheel
        run: uv build --wheel -o dist

      - name: Import it with only its declared dependencies
        run: uv run --isolated --no-project --with dist/*.whl python -c "import confkit"
