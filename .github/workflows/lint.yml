name: Lint

# Called from ci.yml twice: once for the package and once for the public API
# as the examples use it.
on:
  workflow_call:
    inputs:
      cache-prefix:
        description: Cache key prefix that keeps the two callers apart.
        required: true
        type: string
      tools:
        description: JSON list of {"tool", "args"} objects, one matrix entry each.
        required: true
        type: string

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.tools) }}

    steps:
      - uses: actions/checkout@v7

      # The lint group in uv.lock pins every tool, so a tool upgrade changes
      # the key. A hit means this tool already passed on these exact inputs.
      - name: Cache lint result
        id: cache-lint
        uses: actions/cache@v4
        with:
          path: .lint_cache
          key: ${{ runner.os }}-${{ inputs.cache-prefix }}-${{ matrix.tool }}-${{ hashFiles('src/**', 'tests/**', 'examples/**', 'pyproject.toml', 'uv.lock', 'ruff.toml', '.github/workflows/ci.yml', '.github/workflows/lint.yml', '.github/actions/setup/**') }}

      - name: Set up the project
        if: steps.cache-lint.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup
        with:
          sync-args: --group dev --group lint

      - name: Run ${{ matrix.tool }}
        if: steps.cache-lint.outputs.cache-hit != 'true'
        run: uv run ${{ matrix.tool }} ${{ matrix.args }}

      - name: Record the pass
        if: steps.cache-lint.outputs.cache-hit != 'true'
        run: mkdir -p .lint_cache && touch ".lint_cache/${{ matrix.tool }}"
