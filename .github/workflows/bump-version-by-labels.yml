name: Bump Version By Labels

# Called from ci.yml once all-checks passes on a push to master. The action
# looks up the merged PR for the pushed commit and opens a bump PR from its
# Major, Minor or Patch label. Merging the bump PR runs CI again, and that
# run's release job publishes the new version.
on:
  workflow_call:

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # v4.1.0 is the first release that reads labels on push events.
      - name: Bump by labels
        uses: HEROgold/bump-by-label@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          command: "uv version --bump"
          validate: "uv version"
          base_branch: master
