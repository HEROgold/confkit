name: Bump Version By Labels

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - master

jobs:
  bump-version:
    if: github.event.pull_request.merged == true && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Bump by labels
        uses: HEROgold/bump-by-label@v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          command: "uv version --bump"
          validate: "uv version"
          base_branch: ${{ github.event.pull_request.base.ref }}
